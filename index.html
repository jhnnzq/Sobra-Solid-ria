
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Alimento para Todos</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/login.css">

</head>

<body data-area="publica">

    <main class="login-container">

        <section class="login-card">

            <div class="logo">
                <h1>Alimento para Todos</h1>
                <p>Conectando alimentos, pessoas e oportunidades.</p>
            </div>

            <div class="login-titulo">
                <h2>Bem-vindo de volta!</h2>
                <p>Acesse sua conta para continuar.</p>
            </div>

            <form id="form-login" action="#" method="POST">

                <p class="mensagem" id="mensagem" role="alert"></p>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="btn-entrar">
                    Entrar
                </button>

            </form>

            <div class="login-cadastro">
                <p>
                    Ainda não tem uma conta?
                    <a href="cadastro.html">Criar conta</a>
                </p>
            </div>

        </section>

    </main>

    <script src="assets/js/utils.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/paginas/login.js"></script>

</body>

</html>
